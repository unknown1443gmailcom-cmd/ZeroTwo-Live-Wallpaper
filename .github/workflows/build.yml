name: Build Zero Two Live Wallpaper APK

on:
  workflow_dispatch:
  push:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q ZeroTwo_LiveWallpaper_GitHub_AutoBuild.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: project/ztw
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTwo-Live-Wallpaper-APK
          path: project/ztw/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
