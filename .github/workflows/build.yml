name: Build Zero Two Live Wallpaper APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

          BUILD_FILE=$(find project -path "*/app/build.gradle.kts" -print -quit)
          echo "Found Gradle file: $BUILD_FILE"

          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$BUILD_FILE"
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$BUILD_FILE"
          sed -i 's/JVM_1_8/JVM_17/g' "$BUILD_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          BUILD_FILE=$(find project -path "*/app/build.gradle.kts" -print -quit)
          PROJECT_DIR=$(dirname "$(dirname "$BUILD_FILE")")
          echo "Building project: $PROJECT_DIR"
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTwo-Live-Wallpaper-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
