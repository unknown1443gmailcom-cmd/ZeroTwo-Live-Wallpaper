name: Build Zero Two Live Wallpaper APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)
          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find project -type f -name "settings.gradle.kts" -print -quit | xargs dirname)
          echo "Building project: $PROJECT_DIR"
          gradle --no-daemon -p "$PROJECT_DIR" -Pkotlin.jvm.target.validation.mode=warning :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTwo-Live-Wallpaper-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
